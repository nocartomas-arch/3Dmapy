<!doctype html>
<html lang="cs" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Izometrická města</title>
<meta name="description" content="Izometrické pixel-art mapy měst z otevřených dat: Králův Dvůr, Jílové u Prahy, Varnsdorf, Beroun, Praha 12.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Rozcestník: dlaždice měst; kliknutí otevře mapu přes celou obrazovku (iframe), adresa #<město> jde sdílet.
   Seznam měst je v MESTA níže – nové město = jeden řádek + náhled v nahledy/<slug>.webp. */
:root {
  --night: #1b2333; --panel: #232d42; --edge: #3a4762; --ink: #eef1e6; --muted: #a9b3c4;
  --tile: #c9583b; --grass: #8cc063; --lamp: #f2c66d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font: 16px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 48px 16px 32px; }
h1 { font: 700 clamp(32px, 6vw, 56px)/1.05 "Pixelify Sans", system-ui, sans-serif; letter-spacing: .5px; }
h1 span { color: var(--tile); display: block; }
.lead { color: var(--muted); margin: 12px 0 36px; max-width: 60ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { display: block; background: var(--panel); border: 2px solid var(--edge); color: inherit; text-decoration: none;
  box-shadow: 4px 4px 0 rgba(0, 0, 0, .35); transition: transform .12s, border-color .12s; cursor: pointer; text-align: left; font: inherit; width: 100%; }
.card:hover, .card:focus-visible { transform: translate(-2px, -2px); border-color: var(--lamp); outline: none; }
.card img, .card .ph { display: block; width: 100%; aspect-ratio: 2400 / 1255; object-fit: cover; background: #151b28; }
.card .ph { display: grid; place-items: center; color: var(--muted); font: 500 15px "Pixelify Sans", sans-serif; }
.card .t { padding: 12px 14px 14px; }
.card h2 { font: 700 20px/1.2 "Pixelify Sans", sans-serif; }
.card p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.card.soon { cursor: default; opacity: .6; }
.card.soon:hover { transform: none; border-color: var(--edge); }
footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
footer a { color: var(--muted); }
/* otevřená mapa */
.viewer { position: fixed; inset: 0; background: var(--night); display: none; z-index: 10; }
.viewer.on { display: block; }
.viewer iframe { border: 0; width: 100%; height: 100%; display: block; }
.back { position: fixed; z-index: 11; right: 16px; top: 16px; display: none; background: var(--panel); color: var(--ink);
  border: 2px solid var(--edge); padding: 6px 12px; font: 700 15px "Pixelify Sans", sans-serif; cursor: pointer;
  box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); }
.viewer.on ~ .back { display: block; }
.back:hover { border-color: var(--lamp); }
body.open { overflow: hidden; }
/* mobil: tlačítko jako proužek nad mapou, nic nepřekrývá (mapa má vlastní lištu dole a hlavičku nahoře) */
@media (max-width: 760px) {
  main { padding-top: 32px; }
  .viewer { top: calc(40px + env(safe-area-inset-top, 0px)); }
  .back { top: 0; left: 0; right: 0; height: calc(40px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 16px 0;
    border: 0; border-bottom: 2px solid var(--edge); box-shadow: none; text-align: left; background: var(--night); }
}
</style>
</head>
<body>
<main>
  <h1>Izometrická <span>města</span></h1>
  <p class="lead">Pixel-art mapy měst z otevřených dat, ve stylu SimCity 2000. Vyber město, přibliž si svůj dům, přepni na zimu nebo na noc.</p>
  <div class="grid" id="grid"></div>
  <footer>
    Mapy postavené nástrojem <a href="https://github.com/adamklatovsky/izomapa">izomapa</a> (Adam Klatovský).
    Data © přispěvatelé OpenStreetMap, © ČÚZK, jízdní řády PID. Je to vizualizace pro radost, ne přesná mapa.
  </footer>
</main>
<div class="viewer" id="viewer"><iframe id="frame" title="Mapa města" allow="fullscreen; clipboard-write; web-share"></iframe></div>
<button class="back" id="back" type="button">← Města</button>
<script>
// slug, název, poznámka, adresa mapy (null = připravuje se)
const MESTA = [
  ['kraluv-dvur', 'Králův Dvůr', 'Okres Beroun', 'https://nocartomas-arch.github.io/mapa-kraluv-dvur/'],
  ['levin', 'Starý Levín', 'Detailní mapa – část Králova Dvora', 'https://nocartomas-arch.github.io/mapa-levin/'],
  ['jilove-u-prahy', 'Jílové u Prahy', 'Okres Praha-západ', 'https://nocartomas-arch.github.io/mapa-jilove-u-prahy/'],
  ['varnsdorf', 'Varnsdorf', 'Okres Děčín', 'https://nocartomas-arch.github.io/mapa-varnsdorf/'],
  ['beroun', 'Beroun', 'Okres Beroun', 'https://nocartomas-arch.github.io/mapa-beroun/'],
  ['praha-12', 'Praha 12', 'Modřany, Kamýk, Komořany, Točná, Cholupice', 'https://nocartomas-arch.github.io/mapa-praha-12/'],
];
const grid = document.getElementById('grid'), viewer = document.getElementById('viewer'), frame = document.getElementById('frame');
for (const [slug, nazev, pozn, url] of MESTA) {
  const el = document.createElement(url ? 'button' : 'div');
  el.className = 'card' + (url ? '' : ' soon');
  el.innerHTML = (url ? `<img src="nahledy/${slug}.webp" alt="" loading="lazy">` : `<div class="ph">připravuje se…</div>`) +
    `<div class="t"><h2></h2><p></p></div>`;
  el.querySelector('h2').textContent = nazev;
  el.querySelector('p').textContent = pozn;
  if (url) el.addEventListener('click', () => { location.hash = slug; });
  grid.appendChild(el);
}
// adresa: #<město> nebo #<město>/<pohled mapy> (např. #kraluv-dvur/leto@49.92853,14.00142,0.25)
function route() {
  const [slug, ...rest] = location.hash.slice(1).split('/');
  const m = MESTA.find((x) => x[0] === slug && x[3]);
  if (m) {
    if (frame.dataset.slug !== m[0]) {
      const ramec = location.origin + location.pathname + '#' + m[0];
      frame.src = m[3] + '?ramec=' + encodeURIComponent(ramec) + (rest.length ? '#' + rest.join('/') : '');
      frame.dataset.slug = m[0];
    }
    viewer.classList.add('on'); document.body.classList.add('open');
    document.title = ({ 'jilove-u-prahy': 'Izometrické ', 'praha-12': 'Izometrická ' }[m[0]] || 'Izometrický ') + m[1];
    frame.focus();
  } else {
    viewer.classList.remove('on'); document.body.classList.remove('open'); document.title = 'Izometrická města';
  }
}
// mapa v rámečku hlásí svůj pohled -> přepsat adresu rozcestníku (bez nového záznamu v historii)
addEventListener('message', (e) => {
  if (e.source !== frame.contentWindow || typeof e.data?.izomapa !== 'string' || !frame.dataset.slug) return;
  history.replaceState(null, '', '#' + frame.dataset.slug + '/' + e.data.izomapa);
});
document.getElementById('back').addEventListener('click', () => { history.pushState(null, '', location.pathname); frame.dataset.slug = ''; frame.src = 'about:blank'; route(); });
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
